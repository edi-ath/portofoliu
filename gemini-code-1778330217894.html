<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane Doe | Photography</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- Base Styles --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --light-text: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        h1, h2, h3, .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            background-color: transparent;
            position: absolute;
            width: 100%;
            z-index: 10;
            color: white; /* Adjusted for dark hero image */
        }

        .logo {
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* --- Hero Section --- */
        .hero {
            height: 80vh;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1469334031218-e382a71b716b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- Masonry Gallery --- */
        .gallery-container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 5%;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: var(--text-color);
        }

        .masonry {
            column-count: 3;
            column-gap: 20px;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }

        .masonry-item:hover img {
            transform: scale(1.03);
        }

        /* --- Lightbox --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #333;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 60px 20px;
            color: var(--light-text);
            font-size: 0.85rem;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .masonry { column-count: 2; }
            .hero h1 { font-size: 3rem; }
        }

        @media (max-width: 600px) {
            .masonry { column-count: 1; }
            header { flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">JANE DOE</div>
        <nav>
            <ul>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Image Section -->
    <section class="hero">
        <h1>Capturing Moments</h1>
        <p>Lifestyle & Wedding Photography</p>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-container">
        <h2 class="gallery-title">Recent Work</h2>
        
        <div class="masonry">
            <!-- Replace the src attributes with your own image URLs -->
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Wedding 1"></div>
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Wedding 2"></div>
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Wedding 3"></div>
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Portrait 1"></div>
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1537368910025-700350fe46c7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Couple 1"></div>
            <div class="masonry-item"><img src="https://images.unsplash.com/photo-1494955870715-979ca4f13bf0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Details"></div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Full Screen">
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Jane Doe Photography. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Lightbox -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const images = document.querySelectorAll('.masonry-item img');

        // Open Lightbox
        images.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        // Close Lightbox
        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        // Close on clicking outside the image
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
