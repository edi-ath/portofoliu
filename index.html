<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/doia7pbfh/image/upload/v1778430499/cropped_circle_image_iueywi.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edi Antohe — Fotograf</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f7f4ef;--warm:#fdfcfa;--dark:#1c1a17;--mid:#6b6760;--line:#d4d0c8;
  --accent:#8a7460;--accent-l:#c4b09a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --nav:64px;--ease:.4s cubic-bezier(.25,.46,.45,.94)
}
html{scroll-behavior:smooth}
body{background:var(--warm);color:var(--dark);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);display:flex;align-items:center;justify-content:space-between;padding:0 3rem;z-index:100;transition:background var(--ease),box-shadow var(--ease)}
.nav.scrolled{background:rgba(253,252,250,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.nav-logo{font-family:var(--serif);font-size:1.4rem;font-weight:400;letter-spacing:.18em;color:var(--dark);text-decoration:none;transition:opacity var(--ease)}
.nav-logo:hover{opacity:.6}
.nav-links{display:flex;list-style:none;gap:2.5rem}
.nav-links a{font-family:var(--sans);font-size:.78rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;position:relative;transition:color var(--ease)}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--dark);transform:scaleX(0);transition:transform var(--ease);transform-origin:left}
.nav-links a:hover,.nav-links a.active{color:var(--dark)}
.nav-links a.active::after,.nav-links a:hover::after{transform:scaleX(1)}
.nav-menu-btn{display:none;flex-direction:column;gap:6px;background:none;border:none;cursor:pointer;padding:4px}
.nav-menu-btn span{display:block;width:24px;height:1px;background:var(--dark)}

/* MOBILE MENU */
.mm{position:fixed;inset:0;background:var(--warm);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(-100%);transition:transform .5s cubic-bezier(.76,0,.24,1)}
.mm.open{transform:translateY(0)}
.mm ul{list-style:none;text-align:center}
.mm ul li{margin:1.5rem 0}
.mm ul li a{font-family:var(--serif);font-size:2.5rem;font-weight:300;color:var(--dark);text-decoration:none;transition:opacity var(--ease)}
.mm ul li a:hover{opacity:.5}
.mm-x{position:absolute;top:1.5rem;right:2rem;font-size:1.2rem;background:none;border:none;cursor:pointer;color:var(--mid)}

/* HERO */
.hero{height:100vh;min-height:600px;display:flex;align-items:center;justify-content:center;position:relative;background:url('https://res.cloudinary.com/doia7pbfh/image/upload/v1778411155/IMG_6628_w1i24l.jpg') center/cover no-repeat;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,8,6,.5) 0%,rgba(10,8,6,.2) 50%,rgba(10,8,6,.6) 100%);z-index:1}
.hero-content{text-align:center;position:relative;z-index:2;animation:fade 1.2s ease forwards}
@keyframes fade{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.hero-label{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:1rem;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero-title{font-family:var(--serif);font-size:clamp(3.5rem,8vw,7rem);font-weight:300;line-height:1.05;letter-spacing:.02em;color:#fff;margin-bottom:1.25rem;text-shadow:0 2px 32px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.8),0 0 60px rgba(0,0,0,.5)}
.hero-title em{font-style:italic;color:#ebd8cc}
.hero-sub{font-family:var(--serif);font-size:clamp(1rem,2vw,1.2rem);font-weight:300;font-style:italic;color:rgba(255,255,255,.75);margin-bottom:2.5rem;max-width:600px;text-shadow:0 2px 32px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.8),0 0 60px rgba(0,0,0,.5)}
.hero-cta{font-family:var(--sans);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:4px;transition:opacity var(--ease),letter-spacing var(--ease)}
.hero-cta:hover{opacity:.6;letter-spacing:.24em}
.scroll-hint{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.75rem;animation:fade 1.6s .4s ease both;z-index:2}
.scroll-hint span{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.scroll-line{width:1px;height:48px;background:rgba(255,255,255,.3);animation:grow 1.5s 1s ease forwards;transform-origin:top;transform:scaleY(0)}
@keyframes grow{to{transform:scaleY(1)}}
.nav:not(.scrolled) .nav-logo{color:#fff}
.nav:not(.scrolled) .nav-links a{color:rgba(255,255,255,.6)}
.nav:not(.scrolled) .nav-links a:hover,.nav:not(.scrolled) .nav-links a.active{color:#fff}
.nav:not(.scrolled) .nav-links a::after{background:#fff}
.nav:not(.scrolled) .nav-menu-btn span{background:#fff}

/* FILTER BAR */
.gallery-header{padding:0 3rem;position:sticky;top:var(--nav);z-index:50;background:var(--warm);border-bottom:1px solid var(--line)}
.filter-bar{display:flex;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{background:none;border:none;font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);cursor:pointer;padding:1rem 1.5rem;position:relative;white-space:nowrap;transition:color var(--ease)}
.filter-btn::after{content:'';position:absolute;bottom:0;left:1rem;right:1rem;height:1px;background:var(--dark);transform:scaleX(0);transition:transform var(--ease)}
.filter-btn.active,.filter-btn:hover{color:var(--dark)}
.filter-btn.active::after{transform:scaleX(1)}

/* GALLERY */
/* GALLERY */
.gallery{display:flex;gap:3px;padding:3px;background:var(--line);min-height:200px;align-items:flex-start}
.masonry-col{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.gi{position:relative;overflow:hidden;cursor:pointer;background:#1e1c1a}
.gi-img{width:100%;position:relative;overflow:hidden;background:#1e1c1a}
.gi-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.gi:hover .gi-img img{transform:scale(1.04)}
.gi-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,26,23,.72) 0%,rgba(28,26,23,0) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;opacity:0;transition:opacity var(--ease)}
.gi:hover .gi-overlay{opacity:1}
.gi-cat{font-family:var(--sans);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:.25rem}
.gi-title{font-family:var(--serif);font-size:1.2rem;font-weight:300;color:#fff;font-style:italic}
.gi.hidden{display:none}

/* LOADING STATE */
.gallery-loading{display:flex;align-items:center;justify-content:center;height:300px;font-family:var(--sans);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);grid-column:1/-1}
.gallery-empty{display:none;align-items:center;justify-content:center;height:200px;font-family:var(--serif);font-size:1.2rem;font-style:italic;color:var(--mid);grid-column:1/-1}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(28,26,23,.97);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease}
.lb.open{opacity:1;pointer-events:all}
.lb-x,.lb-p,.lb-n{position:absolute;background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;transition:color .2s;font-family:var(--sans);font-size:1.6rem;padding:1rem}
.lb-x:hover,.lb-p:hover,.lb-n:hover{color:#fff}
.lb-x{top:1rem;right:1.5rem;font-size:1.4rem}
.lb-p{left:1rem;top:50%;transform:translateY(-50%)}
.lb-n{right:1rem;top:50%;transform:translateY(-50%)}
@media(max-width:600px){
  .lb-p{top:auto;bottom:1.5rem;left:calc(50% - 60px);transform:none;font-size:2rem;padding:1rem 1.5rem;background:rgba(255,255,255,.1);border-radius:50%}
  .lb-n{top:auto;bottom:1.5rem;right:calc(50% - 60px);transform:none;font-size:2rem;padding:1rem 1.5rem;background:rgba(255,255,255,.1);border-radius:50%}
  .lb-inner{margin-bottom:80px}
}
.lb-inner{display:flex;align-items:center;justify-content:center;width:min(90vw,900px);height:min(85vh,700px);position:relative}
.lb-inner img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;transition:opacity .25s ease;display:block}
.lb-info{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.lb-icat{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);font-family:var(--sans)}
.lb-ititle{font-family:var(--serif);font-size:1.2rem;font-weight:300;font-style:italic;color:rgba(255,255,255,.85)}
.lb-counter{font-size:.65rem;letter-spacing:.1em;color:rgba(255,255,255,.35);font-family:var(--sans);margin-top:.25rem}

/* FOOTER */
.footer{padding:3rem 4rem;border-top:1px solid var(--line);background:var(--warm)}
.footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.f-logo{font-family:var(--serif);font-size:1.2rem;letter-spacing:.18em;color:var(--dark)}
.f-copy{font-size:.75rem;color:var(--line)}
.f-links{display:flex;gap:1.5rem}
.f-links a{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color var(--ease)}
.f-links a:hover{color:var(--dark)}

@media(max-width:1100px){
  .gallery{columns:4}
}
@media(max-width:900px){
  .nav{padding:0 1.5rem}
  .nav-links{display:none}
  .nav-menu-btn{display:flex}
  .footer{padding:2rem}
  .footer-inner{flex-direction:column;text-align:center}
  .gallery-header{padding:0 1rem}
}
.f-links a svg{display:block;transition:color var(--ease)}
.f-links a{color:var(--mid)}
.f-links a:hover{color:var(--dark)}
</style>
</head>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
// Category labels in Romanian (key = data-f value in photos.json)
const CATEGORY_LABELS = {
  all:            'Toate',
  majorate:       'Majorate',
  masini:         'Masini',
  sedintefoto:    'Sedinte Foto',
  sufletepereche: 'Suflete Pereche',
  botez:          'Botez',
  extra:          'Extra'
};

// ── NAV SCROLL ───────────────────────────────────────────────────────────────
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 40));

// ── MOBILE MENU ──────────────────────────────────────────────────────────────
const mm = document.getElementById('mm');
document.getElementById('mBtn').onclick = () => { mm.classList.add('open'); document.body.style.overflow = 'hidden'; };
document.getElementById('mX').onclick   = () => { mm.classList.remove('open'); document.body.style.overflow = ''; };

// ── GALLERY ENGINE ───────────────────────────────────────────────────────────
const gallery      = document.getElementById('gallery');
const filterBar    = document.getElementById('filterBar');
const loadingEl    = document.getElementById('galleryLoading');

let allPhotos  = [];   // full list from photos.json
let visible    = [];   // currently visible photos (after filter)
let activeFilter = 'all';

// Size cycling — auto-assigns tall/wide/normal in a pleasant pattern
// so you don't have to set "size" in JSON for every photo
const COLS = () => window.innerWidth > 1100 ? 5 : window.innerWidth > 900 ? 4 : window.innerWidth > 540 ? 3 : 2;

const ratioCache = {};

function getRatio(src) {
  return new Promise(resolve => {
    if (ratioCache[src]) return resolve(ratioCache[src]);
    const img = new Image();
    img.onload  = () => { ratioCache[src] = img.naturalHeight / img.naturalWidth; resolve(ratioCache[src]); };
    img.onerror = () => { ratioCache[src] = 0.75; resolve(0.75); };
    // 20px wide thumbnail — loads in ~1kb, instant
    img.src = src.replace('/upload/', '/upload/w_20,q_1/');
  });
}

async function renderGallery(photos) {
  gallery.innerHTML = '<div class="gallery-loading">Se incarca...</div>';

  if (photos.length === 0) {
    gallery.innerHTML = '<div class="gallery-loading">Nicio fotografie in aceasta categorie.</div>';
    return;
  }

  // Preload all ratios in parallel using tiny thumbnails
  await Promise.all(photos.map(p => getRatio(p.src)));

  gallery.innerHTML = '';
  const cols = COLS();
  const colEls = [];
  const heights = new Array(cols).fill(0);

  for (let c = 0; c < cols; c++) {
    const col = document.createElement('div');
    col.className = 'masonry-col';
    gallery.appendChild(col);
    colEls.push(col);
  }

  photos.forEach(photo => {
    const globalIndex = allPhotos.indexOf(photo);
    const catLabel    = CATEGORY_LABELS[photo.category] || photo.category;
    const ratio       = ratioCache[photo.src] || 0.75;
    const shortest    = heights.indexOf(Math.min(...heights));
    heights[shortest] += ratio * 100;

    const div = document.createElement('div');
    div.className = 'gi';
    div.dataset.c = photo.category;
    div.dataset.i = globalIndex;
    // Use w_800 for gallery, full res goes to lightbox
    const thumbSrc = photo.src.replace('/upload/', '/upload/w_800,q_auto,f_auto/');
    div.innerHTML = `
      <div class="gi-img" style="padding-bottom:${(ratio * 100).toFixed(2)}%">
        <img src="${thumbSrc}" alt="${photo.title || catLabel}" loading="lazy">
      </div>
      <div class="gi-overlay">
        <span class="gi-cat">${catLabel}</span>
        <p class="gi-title">${photo.title || ''}</p>
      </div>`;
    div.addEventListener('click', () => openLightbox(globalIndex));
    colEls[shortest].appendChild(div);
  });
}

function applyFilter(f) {
  activeFilter = f;
  visible = f === 'all' ? allPhotos : allPhotos.filter(p => p.category === f);
  renderGallery(visible);
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => applyFilter(activeFilter), 250);
});
  
function buildFilterBar(photos) {
  // collect unique categories in order of appearance
  const seen = new Set();
  const cats = [];
  photos.forEach(p => { if (!seen.has(p.category)) { seen.add(p.category); cats.push(p.category); } });

  filterBar.innerHTML = '';

  // "Toate" always first
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.dataset.f = 'all';
  allBtn.textContent = CATEGORY_LABELS['all'];
  allBtn.addEventListener('click', () => applyFilter('all'));
  filterBar.appendChild(allBtn);

  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.f = cat;
    btn.textContent = CATEGORY_LABELS[cat] || cat;
    btn.addEventListener('click', () => applyFilter(cat));
    filterBar.appendChild(btn);
  });
}

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
const lb     = document.getElementById('lb');
const lbImg  = document.getElementById('lbImg');
const lbInfo = document.getElementById('lbInfo');
let lbCur    = 0;

function showLb(globalIndex) {
  lbCur = globalIndex;
  const photo = allPhotos[globalIndex];
  const visIdx = visible.indexOf(photo);
  const total  = visible.length;

  lbImg.style.opacity = 0;
  lbImg.onload = () => { lbImg.style.opacity = 1; };
  lbImg.src = photo.src;
  lbImg.alt = photo.title || '';

  const catLabel = CATEGORY_LABELS[photo.category] || photo.category;
  lbInfo.innerHTML = `
    <div class="lb-icat">${catLabel}</div>
    <div class="lb-ititle">${photo.title || ''}</div>
    <div class="lb-counter">${visIdx + 1} / ${total}</div>`;
}

function openLightbox(globalIndex) {
  showLb(globalIndex);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() { lb.classList.remove('open'); document.body.style.overflow = ''; }

function lbStep(dir) {
  // navigate within the currently visible (filtered) set
  const visIdx = visible.indexOf(allPhotos[lbCur]);
  const next   = (visIdx + dir + visible.length) % visible.length;
  showLb(allPhotos.indexOf(visible[next]));
}

document.getElementById('lbX').onclick = closeLightbox;
document.getElementById('lbP').onclick = () => lbStep(-1);
document.getElementById('lbN').onclick = () => lbStep(1);
lb.addEventListener('click', e => { if (e.target === lb || e.target.id === 'lbInner') closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   lbStep(-1);
  if (e.key === 'ArrowRight')  lbStep(1);
});

// Swipe support for mobile
let swipeStartX = 0;
let swipeStartY = 0;
lb.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, {passive: true});
lb.addEventListener('touchend', e => {
  if (!lb.classList.contains('open')) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    dx < 0 ? lbStep(1) : lbStep(-1);
  }
  if (dy > 80 && Math.abs(dx) < 40) closeLightbox();
}, {passive: true});

// ── BOOT: fetch photos.json ───────────────────────────────────────────────────
fetch('photos.json')
  .then(r => {
    if (!r.ok) throw new Error('photos.json not found');
    return r.json();
  })
  .then(photos => {
    allPhotos = photos;
    buildFilterBar(photos);
    applyFilter('all');
  })
  .catch(err => {
    loadingEl.textContent = 'Eroare la incarcarea fotografiilor. Verifica photos.json.';
    console.error(err);
  });
</script>
</body>
</html>
